<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>J.A.R.V.I.S</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#00d4ff;--dark:#020b18;--darker:#010810;--panel:rgba(0,212,255,0.05);--glow:0 0 20px rgba(0,212,255,0.4);--red:#ff3b3b;--green:#00ff88}
    body{background:var(--darker);color:var(--blue);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:40px 40px;z-index:0;animation:gridPulse 8s ease-in-out infinite}
    @keyframes gridPulse{0%,100%{opacity:0.5}50%{opacity:1}}
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px);pointer-events:none;z-index:1}
    header{position:relative;z-index:10;width:100%;max-width:900px;padding:24px 20px 0;text-align:center}
    .logo{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(2rem,8vw,4rem);letter-spacing:0.3em;color:var(--blue);text-shadow:var(--glow),0 0 80px rgba(0,212,255,0.3);animation:logoFlicker 6s ease-in-out infinite}
    @keyframes logoFlicker{0%,90%,100%{opacity:1}92%{opacity:0.7}94%{opacity:1}96%{opacity:0.85}}
    .subtitle{font-size:0.75rem;letter-spacing:0.5em;color:rgba(0,212,255,0.5);margin-top:4px;text-transform:uppercase}
    .status-bar{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:16px;font-size:0.7rem;letter-spacing:0.15em;color:rgba(0,212,255,0.5)}
    .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
    .orb-wrapper{position:relative;z-index:10;margin:30px auto 0;display:flex;flex-direction:column;align-items:center}
    .orb-container{width:200px;height:200px;position:relative;cursor:pointer}
    .ring{position:absolute;border-radius:50%;border:1px solid rgba(0,212,255,0.2);top:50%;left:50%;transform:translate(-50%,-50%);animation:rotate 10s linear infinite}
    .ring:nth-child(1){width:220px;height:220px;animation-duration:10s}
    .ring:nth-child(2){width:240px;height:240px;animation-duration:15s;animation-direction:reverse;border-color:rgba(0,212,255,0.1)}
    .ring:nth-child(3){width:260px;height:260px;animation-duration:20s;border-color:rgba(0,212,255,0.06)}
    .ring::before{content:'';position:absolute;width:6px;height:6px;background:var(--blue);border-radius:50%;top:4px;left:50%;transform:translateX(-50%);box-shadow:0 0 6px var(--blue)}
    @keyframes rotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
    .orb{position:absolute;width:140px;height:140px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,rgba(0,212,255,0.3),rgba(0,50,100,0.8) 60%,var(--darker) 100%);border:1px solid rgba(0,212,255,0.4);box-shadow:var(--glow),inset 0 0 30px rgba(0,212,255,0.1),0 0 60px rgba(0,212,255,0.15);display:flex;align-items:center;justify-content:center;transition:all 0.3s ease}
    .orb-icon{font-size:2.5rem;filter:drop-shadow(0 0 10px var(--blue));transition:all 0.3s}
    .orb.listening{background:radial-gradient(circle at 40% 35%,rgba(0,255,136,0.4),rgba(0,80,50,0.8) 60%,var(--darker) 100%);border-color:var(--green);box-shadow:0 0 30px rgba(0,255,136,0.5),inset 0 0 30px rgba(0,255,136,0.15);animation:orbPulse 1s ease-in-out infinite}
    .orb.speaking{background:radial-gradient(circle at 40% 35%,rgba(0,180,255,0.5),rgba(0,80,150,0.8) 60%,var(--darker) 100%);border-color:#4dd9ff;box-shadow:0 0 40px rgba(0,212,255,0.7),inset 0 0 30px rgba(0,212,255,0.2);animation:orbSpeak 0.6s ease-in-out infinite alternate}
    .orb.processing{animation:orbSpin 2s linear infinite}
    @keyframes orbPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
    @keyframes orbSpeak{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.06)}}
    @keyframes orbSpin{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
    .wave-bars{display:flex;align-items:center;gap:3px;height:30px;margin-top:16px}
    .bar{width:3px;background:var(--blue);border-radius:2px;height:4px;box-shadow:0 0 4px var(--blue)}
    .wave-bars.active .bar{animation:waveAnim 0.5s ease-in-out infinite alternate}
    .bar:nth-child(1){animation-delay:0s;--max-h:8px}.bar:nth-child(2){animation-delay:0.1s;--max-h:18px}
    .bar:nth-child(3){animation-delay:0.2s;--max-h:25px}.bar:nth-child(4){animation-delay:0.05s;--max-h:12px}
    .bar:nth-child(5){animation-delay:0.15s;--max-h:22px}.bar:nth-child(6){animation-delay:0.25s;--max-h:16px}
    .bar:nth-child(7){animation-delay:0.08s;--max-h:28px}.bar:nth-child(8){animation-delay:0.18s;--max-h:10px}
    @keyframes waveAnim{from{height:3px}to{height:var(--max-h,20px)}}
    #mode-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.3em;color:rgba(0,212,255,0.6);margin-top:12px;text-transform:uppercase;min-height:16px}
    #lang-indicator{font-size:0.6rem;letter-spacing:0.15em;color:rgba(0,212,255,0.4);text-align:center;min-height:14px;margin-top:4px}
    .chat-section{position:relative;z-index:10;width:100%;max-width:800px;padding:20px;display:flex;flex-direction:column;gap:12px}
    .chat-box{background:var(--panel);border:1px solid rgba(0,212,255,0.12);border-radius:12px;padding:20px;min-height:200px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,0.2) transparent;backdrop-filter:blur(10px)}
    .message{display:flex;flex-direction:column;gap:4px;animation:msgIn 0.3s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .message.user{align-items:flex-end}.message.jarvis{align-items:flex-start}
    .msg-label{font-size:0.6rem;letter-spacing:0.2em;opacity:0.4;font-family:'Orbitron',monospace}
    .msg-bubble{padding:10px 16px;border-radius:12px;max-width:85%;font-size:0.95rem;line-height:1.5}
    .message.user .msg-bubble{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.25);color:rgba(0,212,255,0.9);border-radius:12px 12px 4px 12px}
    .message.jarvis .msg-bubble{background:rgba(0,50,100,0.3);border:1px solid rgba(0,212,255,0.15);color:rgba(200,240,255,0.95);border-radius:12px 12px 12px 4px}
    .input-row{display:flex;gap:10px;align-items:center}
    .text-input{flex:1;background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.2);border-radius:8px;padding:12px 16px;color:var(--blue);font-family:'Rajdhani',sans-serif;font-size:1rem;outline:none;transition:border-color 0.3s,box-shadow 0.3s}
    .text-input::placeholder{color:rgba(0,212,255,0.3)}
    .text-input:focus{border-color:rgba(0,212,255,0.5);box-shadow:0 0 15px rgba(0,212,255,0.1)}
    .btn{background:transparent;border:1px solid rgba(0,212,255,0.3);color:var(--blue);padding:10px 16px;border-radius:8px;font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s;white-space:nowrap}
    .btn:hover{background:rgba(0,212,255,0.1);box-shadow:var(--glow);border-color:var(--blue)}
    .btn:active{transform:scale(0.97)}
    .btn.primary{background:rgba(0,212,255,0.15);border-color:var(--blue)}
    .btn.active-lang{background:rgba(0,212,255,0.2);border-color:var(--blue);box-shadow:var(--glow)}
    .controls-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .voice-toggle{display:flex;align-items:center;gap:8px;font-size:0.75rem;color:rgba(0,212,255,0.6);letter-spacing:0.1em}
    .toggle-switch{width:36px;height:20px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);border-radius:10px;cursor:pointer;position:relative;transition:background 0.3s}
    .toggle-switch.on{background:rgba(0,212,255,0.3)}
    .toggle-knob{width:14px;height:14px;background:var(--blue);border-radius:50%;position:absolute;top:2px;left:2px;transition:left 0.3s;box-shadow:0 0 6px var(--blue)}
    .toggle-switch.on .toggle-knob{left:18px}
    .bottom-bar{position:relative;z-index:10;width:100%;max-width:800px;padding:0 20px 20px;display:flex;justify-content:space-between;font-size:0.6rem;letter-spacing:0.2em;color:rgba(0,212,255,0.25);font-family:'Orbitron',monospace}
    .chat-box::-webkit-scrollbar{width:4px}.chat-box::-webkit-scrollbar-track{background:transparent}.chat-box::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}
    .error-msg{color:var(--red);font-size:0.8rem;text-align:center;min-height:20px}
    .thinking-dots span{animation:dotBlink 1.2s ease-in-out infinite;font-size:1.5rem}
    .thinking-dots span:nth-child(2){animation-delay:0.2s}.thinking-dots span:nth-child(3){animation-delay:0.4s}
    @keyframes dotBlink{0%,80%,100%{opacity:0.2}40%{opacity:1}}
  </style>
</head>
<body>
  <header>
    <div class="logo">J.A.R.V.I.S</div>
    <div class="subtitle">Just A Rather Very Intelligent System</div>
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>SYSTEM ONLINE</span>
      <span>|</span>
      <span>GROQ · LLAMA 3.1</span>
      <span>|</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <div class="orb-wrapper">
    <div class="orb-container" id="mic-btn" title="Click to speak">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="orb" id="orb"><span class="orb-icon">🎙️</span></div>
    </div>
    <div class="wave-bars" id="wave-bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div id="mode-label">CLICK TO SPEAK</div>
    <div id="lang-indicator">LANGUAGE: ENGLISH</div>
  </div>

  <div class="chat-section">
    <div class="chat-box" id="chat-box">
      <div class="message jarvis">
        <span class="msg-label">JARVIS</span>
        <div class="msg-bubble">Hello! I am Jarvis — your personal AI assistant. Select language below, then click mic or type. 🤖</div>
      </div>
    </div>
    <div id="error-display" class="error-msg"></div>

    <div class="controls-row">
      <div class="voice-toggle">
        <span>VOICE</span>
        <div class="toggle-switch on" id="voice-toggle" onclick="toggleVoice()">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <!-- Language selector -->
      <button class="btn active-lang" id="btn-en" onclick="setLang('ENGLISH','en-US')">🇬🇧 ENG</button>
      <button class="btn" id="btn-hi" onclick="setLang('HINDI','hi-IN')">🇮🇳 HIN</button>
      <button class="btn" id="btn-hg" onclick="setLang('HINGLISH','hi-IN')">🔀 HINGLISH</button>
      <button class="btn" onclick="resetChat()">↺ RESET</button>
      <button class="btn" onclick="stopSpeaking()">⏹ STOP</button>
    </div>

    <div class="input-row">
      <input type="text" class="text-input" id="text-input" placeholder="Type here and press Enter..." onkeydown="handleKey(event)"/>
      <button class="btn primary" onclick="sendText()">SEND ➤</button>
    </div>
  </div>

  <div class="bottom-bar">
    <span>JARVIS v3.0</span>
    <span id="msg-count">MESSAGES: 0</span>
    <span>POWERED BY GROQ</span>
  </div>

  <script>
    const BACKEND_URL = 'http://localhost:5000';

    let isListening      = false;
    let isSpeaking       = false;
    let voiceEnabled     = true;
    let msgCount         = 0;
    let recognition      = null;
    let currentUtterance = null;
    let currentLang      = 'ENGLISH';   // ENGLISH | HINDI | HINGLISH
    let micLang          = 'en-US';     // BCP-47 for recognition

    // ── Language Selector ───────────────────────────────────────────────────
    function setLang(lang, mic) {
      currentLang = lang;
      micLang     = mic;
      if (recognition) recognition.lang = mic;

      // Update button styles
      ['btn-en','btn-hi','btn-hg'].forEach(id => {
        document.getElementById(id).classList.remove('active-lang');
      });
      const map = { ENGLISH:'btn-en', HINDI:'btn-hi', HINGLISH:'btn-hg' };
      document.getElementById(map[lang]).classList.add('active-lang');

      document.getElementById('lang-indicator').textContent = 'LANGUAGE: ' + lang;
    }

    // ── Speech Recognition ──────────────────────────────────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition                = new SpeechRecognition();
      recognition.continuous     = false;
      recognition.interimResults = true;
      recognition.lang           = micLang;

      recognition.onstart = () => {
        isListening = true;
        setOrbState('listening');
        setMode('LISTENING...');
        waveBars(true);
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('text-input').value = transcript;
      };

      recognition.onend = () => {
        isListening = false;
        waveBars(false);
        const transcript = document.getElementById('text-input').value.trim();
        if (transcript) {
          sendMessage(transcript, currentLang);
        } else {
          setOrbState('idle');
          setMode('CLICK TO SPEAK');
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        setOrbState('idle'); setMode('CLICK TO SPEAK'); waveBars(false);
        showError('Mic error: ' + event.error);
      };
    }

    // ── Orb Click ───────────────────────────────────────────────────────────
    document.getElementById('mic-btn').addEventListener('click', () => {
      if (isSpeaking) { stopSpeaking(); return; }
      if (!recognition) { showError('Use Chrome for voice!'); return; }
      if (isListening) {
        recognition.stop();
      } else {
        clearError();
        document.getElementById('text-input').value = '';
        recognition.lang = micLang;
        recognition.start();
      }
    });

    // ── Orb States ──────────────────────────────────────────────────────────
    function setOrbState(state) {
      const orb  = document.getElementById('orb');
      orb.className = 'orb ' + state;
      const icon = orb.querySelector('.orb-icon');
      if      (state === 'listening')  icon.textContent = '🎙️';
      else if (state === 'processing') icon.textContent = '⚙️';
      else if (state === 'speaking')   icon.textContent = '🔊';
      else                             icon.textContent = '🎙️';
    }
    function setMode(t) { document.getElementById('mode-label').textContent = t; }
    function waveBars(a) { document.getElementById('wave-bars').className = 'wave-bars' + (a ? ' active' : ''); }

    // ── Send Message ────────────────────────────────────────────────────────
    async function sendMessage(text, lang) {
      if (!text.trim()) return;
      document.getElementById('text-input').value = '';

      addMessage('user', text);
      setOrbState('processing'); setMode('PROCESSING...'); waveBars(true);

      const thinkingId = addThinking();

      try {
        const res  = await fetch(`${BACKEND_URL}/ask`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ message: text, lang: lang })
        });

        const data = await res.json();
        removeThinking(thinkingId);

        if (data.error) {
          showError('Error: ' + data.error);
          setOrbState('idle'); setMode('CLICK TO SPEAK'); waveBars(false);
          return;
        }

        addMessage('jarvis', data.reply);

        if (voiceEnabled) {
          speakText(data.reply, lang);
        } else {
          setOrbState('idle'); setMode('CLICK TO SPEAK'); waveBars(false);
        }

      } catch (err) {
        removeThinking(thinkingId);
        showError('Backend not running! Start server on localhost:5000');
        setOrbState('idle'); setMode('CLICK TO SPEAK'); waveBars(false);
      }
    }

    
    // ── Text-to-Speech (Male + More Natural + Voice Interrupt) ─────────────

let stopRecognition = null;

function speakText(text, lang) {
  if (!('speechSynthesis' in window)) return;

  stopSpeaking();

  const cleanText = text
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/#{1,6}\s/g, '')
    .replace(/`(.*?)`/g, '$1')
    .substring(0, 500);

  currentUtterance = new SpeechSynthesisUtterance(cleanText);

  // more natural sound
  currentUtterance.rate = 0.9;
  currentUtterance.pitch = 0.85;
  currentUtterance.volume = 1.0;

  const voices = speechSynthesis.getVoices();

  // Male voice selection
  if (lang === 'HINDI' || lang === 'HINGLISH') {

    currentUtterance.lang = 'hi-IN';

    currentUtterance.voice =
      voices.find(v => v.name.includes("Ravi")) ||
      voices.find(v => v.lang.includes("hi"));

  } else {

    currentUtterance.lang = 'en-US';

    currentUtterance.voice =
      voices.find(v => v.name.includes("David")) ||
      voices.find(v => v.name.includes("Guy")) ||
      voices.find(v => v.name.includes("Mark")) ||
      voices.find(v => v.lang === 'en-US');
  }

  currentUtterance.onstart = () => {
    isSpeaking = true;
    setOrbState('speaking');
    setMode('SPEAKING...');
    waveBars(true);

    startStopListening();
  };

  currentUtterance.onend = () => {
    stopSpeaking();
  };

  currentUtterance.onerror = () => {
    stopSpeaking();
  };

  speechSynthesis.speak(currentUtterance);
}


function stopSpeaking() {

  speechSynthesis.cancel();

  if (stopRecognition) {
    stopRecognition.stop();
  }

  isSpeaking = false;

  setOrbState('idle');
  setMode('CLICK TO SPEAK');
  waveBars(false);
}


// Listen for: "stop jarvis" while speaking
function startStopListening() {

  const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

  if (!SpeechRecognition) return;

  stopRecognition = new SpeechRecognition();

  stopRecognition.continuous = true;
  stopRecognition.interimResults = false;
  stopRecognition.lang = micLang;

  stopRecognition.onresult = (event) => {

      let command =
      event.results[event.results.length-1][0]
      .transcript
      .toLowerCase();

      console.log(command);

      if (
          command.includes("stop jarvis") ||
          command.includes("jarvis stop")
      ) {

          stopSpeaking();
      }
  };

  stopRecognition.start();
}

    // ── UI Helpers ──────────────────────────────────────────────────────────
    function addMessage(role, text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div'); div.className = `message ${role}`;
      const label = document.createElement('span'); label.className = 'msg-label';
      label.textContent = role === 'user' ? 'YOU' : 'JARVIS';
      const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
      bubble.textContent = text;
      div.appendChild(label); div.appendChild(bubble);
      box.appendChild(div); box.scrollTop = box.scrollHeight;
      msgCount++;
      document.getElementById('msg-count').textContent = `MESSAGES: ${msgCount}`;
    }

    function addThinking() {
      const box = document.getElementById('chat-box');
      const id  = 'thinking-' + Date.now();
      const div = document.createElement('div'); div.className = 'message jarvis'; div.id = id;
      const label = document.createElement('span'); label.className = 'msg-label'; label.textContent = 'JARVIS';
      const bubble = document.createElement('div'); bubble.className = 'msg-bubble thinking-dots';
      bubble.innerHTML = '<span>●</span><span>●</span><span>●</span>';
      div.appendChild(label); div.appendChild(bubble);
      box.appendChild(div); box.scrollTop = box.scrollHeight;
      return id;
    }

    function removeThinking(id) { const el = document.getElementById(id); if (el) el.remove(); }
    function showError(msg) { document.getElementById('error-display').textContent = msg; setTimeout(clearError, 6000); }
    function clearError() { document.getElementById('error-display').textContent = ''; }
    function handleKey(e) { if (e.key === 'Enter') sendText(); }
    function sendText() {
      const text = document.getElementById('text-input').value.trim();
      if (text) sendMessage(text, currentLang);
    }
    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voice-toggle').className = 'toggle-switch ' + (voiceEnabled ? 'on' : '');
    }
    async function resetChat() {
      try { await fetch(`${BACKEND_URL}/reset`, { method: 'POST' }); } catch(e) {}
      document.getElementById('chat-box').innerHTML = '';
      msgCount = 0;
      document.getElementById('msg-count').textContent = 'MESSAGES: 0';
      addMessage('jarvis', 'Memory cleared! Ready for a fresh start. 🔄');
    }
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-IN', { hour12: false });
    }
    setInterval(updateClock, 1000); updateClock();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  </script>
</body>
</html>
